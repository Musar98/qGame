<app-pageheader></app-pageheader>
@if (!gameStarted) {
  <main class="start-screen">
    <div class="intro">
      <h2>The Fiddy Question Game</h2>
      <p>Challenge yourself with 50 random questions.</p>
    </div>
    <form class="start-form" (ngSubmit)="startGame()">
      <h3>
        <label for="category">Choose a category</label>
        <select id="category" name="category" [(ngModel)]="categoryId">
          <option [ngValue]="undefined">Any Category</option>
          @for (topicItem of categories; track topicItem.id) {
            <option [ngValue]="topicItem.id">{{ topicItem.name }}</option>
          }
        </select>
        <label for="username">and enter a username:</label>
        <input
          type="text"
          id="username"
          name="username"
          [(ngModel)]="username"
          placeholder="Username"
          required
          minlength="1"
          maxlength="30"
          autocomplete="username"
          (keyup.enter)="onEnterKey()"
        />
      </h3>
      <button type="submit" [disabled]="!isFormValid()">Start</button>
    </form>
  </main>
}
@if (gameStarted) {
  <app-gamescreen [categoryId]="categoryId" [username]="username"></app-gamescreen>
}
<app-pagefooter></app-pagefooter>
