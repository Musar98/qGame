<app-pageheader></app-pageheader>
@if (!gameStarted) {
  <main>
    <div>
      <h2>Random Question Game</h2>
      <p>
        Challenge yourself with
        <input
          type="number"
          id="questionCount"
          name="questionCount"
          [(ngModel)]="questionCount"
          min="1"
          max="50"
          placeholder="50"
          /> random questions.
          <br />
          @if (questionCount < 1 || questionCount > 50) {
            <span style="color: red; font-size: smaller">
              Please enter a number between 1 and 50.
            </span>
          }
        </p>
      </div>
      <div>
        <h3>
          Pick a
          <!--      choosing a-->
          <!--      <select id="category" name="category" [(ngModel)]="category" required>-->
          <!--        <option id="defaultOptionCategory" value="" disabled selected hidden>-->
          <!--          Category-->
        <!--        </option>-->
        <!--        <option>Any Category</option>-->
        <!--        <option *ngFor="let topicItem of categories" [value]="topicItem.name">-->
        <!--          {{ topicItem.name }}-->
      <!--        </option>-->
    <!--      </select>-->
    <!--      and -->
    username:
    <input
      type="text"
      id="username"
      name="username"
      [(ngModel)]="username"
      placeholder="Username"
      required
      (keyup.enter)="onEnterKey()"
      />
    </h3>
    <button (click)="startGame()" [disabled]="!isFormValid()">Start</button>
  </div>
</main>
}

@if (gameStarted) {
  <app-gamescreen
    [category]="category"
    [username]="username"
    [questionCount]="questionCount || 50"
  ></app-gamescreen>
}

<app-pagefooter></app-pagefooter>
<router-outlet />
