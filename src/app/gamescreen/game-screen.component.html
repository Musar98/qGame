<main>
  <p id="timer">{{ formatTimer() }}</p>
  <h4>Question {{ questionCounter }}</h4>
  <p>{{ tryWithRemapped[questionCounter - 1].question }}</p>
  <div class="radio-container">
    <div class="radio-item">
      <input type="radio" id="radio1" name="radioGroup">
      <!--todo remove repetitive click-->
      <label for="radio1" #myLabel
             (click)="evaluate(myLabel)">{{ tryWithRemapped[questionCounter - 1].choices[0] }}</label>
    </div>
    <div class="radio-item">
      <input type="radio" id="radio2" name="radioGroup">
      <label for="radio2" #myLabel
             (click)="evaluate(myLabel)">{{ tryWithRemapped[questionCounter - 1].choices[1] }}</label>
    </div>
    <div class="radio-item">
      <input type="radio" id="radio3" name="radioGroup">
      <label for="radio3" #myLabel
             (click)="evaluate(myLabel)">{{ tryWithRemapped[questionCounter - 1].choices[2] }}</label>
    </div>
    <div class="radio-item">
      <input type="radio" id="radio4" name="radioGroup">
      <label for="radio4" #myLabel
             (click)="evaluate(myLabel)">{{ questionSetDEMO[questionCounter - 1].choices[3] }}</label>
    </div>
  </div>
</main>
