<main>
  <div class="spinner-container" *ngIf="questionSet.length < 1">
    <app-spinner></app-spinner>
  </div>
  <div *ngIf="questionSet && questionSet.length > 0">
    <p id="timer">{{ formatTimer() }}</p>
    <h4>Question {{ questionCounter }}</h4>
    <p>{{ currentQuestion.question }}</p>
    <div class="button-container">
      <button #answerOne (click)="evaluate(answerOne)">
        {{ currentQuestion.choices[0] }}
      </button>
      <button #answerTwo (click)="evaluate(answerTwo)">
        {{ currentQuestion.choices[1] }}
      </button>
      <button #answerThree (click)="evaluate(answerThree)">
        {{ currentQuestion.choices[2] }}
      </button>
      <button #answerFour (click)="evaluate(answerFour)">
        {{ currentQuestion.choices[3] }}
      </button>
    </div>
  </div>
</main>
